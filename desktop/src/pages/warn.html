<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; font-src file:; script-src 'unsafe-inline' file:">
<title>Sentinel</title>
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<script src="card.js"></script>
<style>
  .body .recover { margin: 10px 0 0; font-size: var(--t-note); color: #b9b5ab; }
  .real { margin: 16px 0 0; }
  .real[hidden] { display: none; }
  .real button { width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
</style>
</head>
<body role="alertdialog" aria-labelledby="title" aria-describedby="host lead reasons">
  <div class="head">
    <div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M32 11.6c-5.6 0-10.4 1.8-12.6 5C18.4 18.1 18 19.9 18 21.8v7.8c0 3.8 1.2 7 3.4 9.8L32 49.4l10.6-10c2.2-2.8 3.4-6 3.4-9.8v-7.8c0-1.9-.4-3.7-1.4-5.2-2.2-3.2-7-5-12.6-5ZM21 23.4l8 3-.5 3.6-7.5-1.8ZM43 23.4l-8 3 .5 3.6 7.5-1.8ZM24.6 32l4.6 1.1v8.4l-3-3.4ZM39.4 32l-4.6 1.1v8.4l3-3.4Z"/></svg></div>
    <div>
      <h1 id="title">Sentinel warning</h1>
      <p class="host" id="host"></p>
    </div>
  </div>
  <div class="body">
    <p id="lead"></p>
    <ul id="reasons"></ul>
    <small id="browser" data-trim></small>
    <p class="recover">Already typed a password or paid on it? <button class="link" id="recover">Open the recovery guide</button></p>
  </div>
  <p class="real" id="realRow" hidden><button class="primary" id="real"></button></p>
  <div class="row">
    <button id="details">Open in Sentinel</button>
    <button class="primary" id="close" data-escape>Got it</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const badge = q.get('badge') || 'orange';
    const color = { red: '#e5484d', orange: '#f08a24', yellow: '#f5c542' }[badge] || '#f08a24';
    document.documentElement.style.setProperty('--c', color);
    document.getElementById('title').textContent = q.get('label') || 'Sentinel warning';
    document.getElementById('host').textContent = q.get('host') || '';
    document.getElementById('lead').innerHTML = badge === 'red'
      ? '<b>Leave this page.</b> Sentinel has evidence this site is dangerous. Do not enter passwords, codes or card details on it.'
      : '<b>Be careful on this page.</b> It shows many strong warning signs at once. Do not enter any details on it.';
    const ul = document.getElementById('reasons');
    for (const r of (q.get('reasons') || '').split('\n').filter(Boolean).slice(0, 4)) {
      const li = document.createElement('li');
      li.textContent = r;
      if (ul.children.length) li.dataset.trim = '';
      ul.appendChild(li);
    }
    // The real site (the brand's official address, or one of the person's own sites), never this page's address.
    // One gold button: with a real site to go to, that one, and "Got it" steps back.
    const real = q.get('real');
    if (real) {
      document.getElementById('real').textContent = `Go to the real ${real}`;
      document.getElementById('realRow').hidden = false;
      document.getElementById('close').classList.remove('primary');
      document.getElementById('real').onclick = () => window.sentinelDesktop.warnAction('real');
    }
    const b = q.get('browser');
    document.getElementById('browser').textContent = b ? `Seen in ${b}. Sentinel watched the address of the page in front; it did not read the page.` : '';
    document.getElementById('close').onclick = () => window.sentinelDesktop.warnAction('close');
    document.getElementById('details').onclick = () => window.sentinelDesktop.warnAction('open', q.get('url') || '');
    document.getElementById('recover').onclick = () => window.sentinelDesktop.warnAction('recover', 'password');
    // The keyboard starts on the one gold button once the person clicks into the card (the window never takes it).
    document.getElementById(real ? 'real' : 'close').focus();
  </script>
</body>
</html>
