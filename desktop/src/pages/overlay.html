<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:">
<title>Sentinel live scanning</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e9e6df; }
  * { box-sizing: border-box; }
  body { position: relative; }

  /* The tint and the line */
  .tint { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(214, 178, 90, .17), rgba(214, 178, 90, .07) 60%, rgba(214, 178, 90, .04)); }
  .line { position: absolute; left: 0; right: 0; top: 0; height: 3px; opacity: 0; pointer-events: none; will-change: transform;
    background: linear-gradient(90deg, rgba(233, 207, 138, 0), #e2c47f 18%, #fff4d2 50%, #e2c47f 82%, rgba(233, 207, 138, 0));
    box-shadow: 0 0 22px 5px rgba(214, 178, 90, .5), 0 0 3px 1px rgba(255, 244, 210, .8); }
  .line::before { content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 140px;
    background: linear-gradient(0deg, rgba(214, 178, 90, .16), rgba(214, 178, 90, 0)); }
  body.sweeping .tint { animation: tint 2.7s ease-out forwards; }
  body.sweeping .line { animation: line 1.35s cubic-bezier(.45, .05, .25, 1) forwards; }
  @keyframes tint { 0% { opacity: 0; } 12% { opacity: 1; } 55% { opacity: .85; } 100% { opacity: 0; } }
  @keyframes line { 0% { transform: translateY(-6px); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }

  /* The corner mask: Sentinel is watching this browser */
  .corner { position: absolute; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px; flex-direction: row-reverse;
    opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; pointer-events: none; }
  .corner.is-on { opacity: 1; transform: none; }
  /* Fullscreen video: out of the way, unless the page is dangerous. */
  .corner.is-on.is-quiet:not(.is-flagged) { opacity: 0; }
  .corner__mask { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 12px; color: var(--c, #d6b25a);
    background: rgba(12, 13, 16, .88); border: 1px solid color-mix(in srgb, var(--c, #d6b25a) 55%, transparent);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .35), 0 0 0 0 rgba(214, 178, 90, .0); animation: breathe 3.6s ease-in-out infinite; }
  .corner__mask svg { width: 30px; height: 30px; display: block; }
  .corner__label { max-width: 320px; padding: 8px 12px; border-radius: 9px; background: rgba(12, 13, 16, .9); border: 1px solid rgba(255, 255, 255, .08);
    color: #e9e6df; font-size: 12.5px; opacity: 0; transform: translateX(6px); transition: opacity .3s ease, transform .3s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .corner__label.is-on { opacity: 1; transform: none; }
  .corner__label b { font-weight: 600; color: var(--c, #e2c47f); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 6px 22px rgba(0, 0, 0, .35), 0 0 0 0 rgba(214, 178, 90, 0); } 50% { box-shadow: 0 6px 22px rgba(0, 0, 0, .35), 0 0 16px 2px rgba(214, 178, 90, .28); } }

  /* A mask beside every result. The layer moves with the page between reads (see overlay:shift). */
  /* The clip stays where the message list is; the marks inside it move with the page. */
  #clip { position: absolute; inset: 0; }
  #marks { position: absolute; inset: 0; will-change: transform; }
  .mark { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: 0; display: grid; place-items: center; border-radius: 8px; pointer-events: none;
    background: rgba(12, 13, 16, .88); box-shadow: 0 2px 10px rgba(0, 0, 0, .28), 0 0 12px -2px color-mix(in srgb, var(--c, #8f8a7a) 55%, transparent); border: 1px solid color-mix(in srgb, var(--c, #8f8a7a) 50%, transparent); color: var(--c, #8f8a7a);
    opacity: 0; scale: .6; will-change: transform; transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
  .mark.is-still { transition: none; }
  .mark svg { width: 20px; height: 20px; display: block; }
  .mark.is-clear { width: 20px; height: 20px; border-radius: 6px; background: rgba(12, 13, 16, .8); box-shadow: 0 1px 6px rgba(0, 0, 0, .2); }
  .mark.is-clear svg { width: 12px; height: 12px; }
  .mark.is-pending { width: 10px; height: 10px; border-radius: 3px; border: 0; box-shadow: none; background: #d6b25a; opacity: .0; animation: wait 1s ease-in-out infinite; }
  .mark.is-in { animation: pop .34s cubic-bezier(.2, 1.4, .4, 1) var(--d, 0ms) forwards; }
  @keyframes pop { 0% { opacity: 0; scale: .55; } 100% { opacity: 1; scale: 1; } }
  @keyframes wait { 0%, 100% { opacity: .25; } 50% { opacity: .8; } }

  .tip { position: absolute; max-width: 300px; padding: 9px 12px; border-radius: 9px; background: rgba(12, 13, 16, .95); border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); opacity: 0; transition: opacity .15s ease; pointer-events: none; z-index: 5; }
  .tip.is-on { opacity: 1; }
  .tip b { display: block; font-weight: 600; color: var(--c, #e9e6df); margin-bottom: 2px; }
  .tip span { color: #b9b5ab; font-size: 12.5px; }

  @media (prefers-reduced-motion: reduce) {
    body.sweeping .line { animation: none; }
    body.sweeping .tint { animation: tint 1.2s ease-out forwards; }
    .corner__mask { animation: none; }
    .mark.is-in { animation: none; opacity: 1; scale: 1; }
    .mark { transition: none; }
    .mark.is-pending { animation: none; opacity: .5; }
  }
</style>
</head>
<body>
  <div class="tint"></div>
  <div class="line"></div>
  <div id="clip"><div id="marks"></div></div>
  <div class="tip" id="tip"><b></b><span></span></div>
  <div class="corner" id="corner">
    <div class="corner__mask" id="cornerMask"></div>
    <div class="corner__label" id="cornerLabel"></div>
  </div>
<script src="../../shared/masks.js"></script>
<script>
(function () {
  'use strict';
  var M = window.SentinelMasks;
  var GOLD = '#d6b25a';
  var tracing = /[?&]trace=1\b/.test(location.search);   // end-to-end runs only (see overlay.js)
  var reduceMotion =window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.6 4.6L19 7.4"/></svg>';
  var corner = document.getElementById('corner');
  var cornerMask = document.getElementById('cornerMask');
  var cornerLabel = document.getElementById('cornerLabel');
  var marksEl = document.getElementById('marks');
  var tip = document.getElementById('tip');
  // One element per result, kept by the result's key: when scrolling brings new results in and takes others out,
  // the marks that stay are the same elements, untouched, and only newcomers pop in.
  var nodes = new Map();
  var current = [];
  var labelTimer = null;
  var sweepTimer = null;
  var flagged = false;
  var sticky = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /** Words beside the corner mask. They leave by themselves unless `keep` (a warning stays while its page does). */
  function say(html, color, keep) {
    clearTimeout(labelTimer);
    cornerLabel.style.setProperty('--c', color || '#e2c47f');
    cornerLabel.innerHTML = html;
    cornerLabel.classList.add('is-on');
    sticky = Boolean(keep);
    if (!keep) labelTimer = setTimeout(function () { cornerLabel.classList.remove('is-on'); }, 4200);
  }

  function setCorner(kind, color) {
    cornerMask.style.setProperty('--c', color || GOLD);
    cornerMask.innerHTML = M.svg(kind || 'scam');
  }

  function sweep() {
    clearTimeout(sweepTimer);
    document.body.classList.remove('sweeping');
    void document.body.offsetWidth;   // restart the animation
    document.body.classList.add('sweeping');
    sweepTimer = setTimeout(function () { document.body.classList.remove('sweeping'); }, 2800);
  }

  function clearMarks() {
    nodes.forEach(function (n) { n.remove(); });
    nodes.clear();
    current = [];
    tip.classList.remove('is-on');
  }

  // Where a mark goes for one result. A link covering several lines (Google now puts the site name and address
  // above the title, inside the same link) gets its mark level with the last line, which is the title, not beside
  // the small address line at the top.
  function spot(m, size, W) {
    var x = m.x + m.w + 8;
    var y = m.y + Math.min(m.h, 26) / 2 - size / 2;
    if (m.row) {
      // Inbox rows span the page: the mark sits inside the row, near its right end, centred on it.
      x = m.x + m.w - size - 64;
      y = m.y + m.h / 2 - size / 2;
    } else {
      if (m.h > 40) y = m.y + m.h - 15 - size / 2;
      if (x + size > W - 6) x = Math.max(4, m.x - size - 8);
    }
    return { x: Math.round(x), y: Math.round(y) };
  }

  function moveTo(n, x, y) { n.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)'; n._x = x; n._y = y; }

  // rebase: how far the whole layer had moved when these positions were read (a new read after a scroll). Marks that
  // stay are first put where they are on screen right now, on the new footing, and then glide the last few pixels
  // to where the fresh read says their result is. Without this they jumped back and forth after every scroll.
  function place(list, rebase) {
    current = list;
    var seen = {};
    var popped = 0;
    var W = window.innerWidth;
    var glide = [];
    list.forEach(function (m, i) {
      var key = m.k || ('#' + i);
      seen[key] = true;
      var state = m.pending ? 'pending' : (m.badge ? m.badge + ':' + m.kind : 'clear');
      var size = m.pending ? 10 : m.badge ? 28 : 20;
      var to = spot(m, size, W);
      m._cx = to.x + size / 2; m._cy = to.y + size / 2;
      var n = nodes.get(key);
      if (!n) {
        // A newcomer appears where it belongs, never flying in from the corner.
        n = document.createElement('div'); n.className = 'mark is-still';
        moveTo(n, to.x, to.y);
        marksEl.appendChild(n); nodes.set(key, n);
      } else if (n._x !== to.x || n._y !== to.y) {
        if (rebase && (rebase.dx || rebase.dy)) { n.classList.add('is-still'); moveTo(n, n._x + rebase.dx, n._y + rebase.dy); }
        glide.push([n, to.x, to.y]);
      }
      if (n.dataset.state === state) return;
      n.dataset.state = state;
      n.className = 'mark is-still' + (m.pending ? ' is-pending' : m.badge ? '' : ' is-clear');
      if (m.pending) { n.innerHTML = ''; return; }
      n.style.setProperty('--c', m.badge ? M.COLORS[m.badge] : M.COLORS.clear);
      // A batch arriving together ripples in; a single newcomer during a scroll appears at once.
      n.style.setProperty('--d', Math.min(popped++, 14) * 45 + 'ms');
      n.innerHTML = m.badge ? M.svg(m.kind) : TICK;
      void n.offsetWidth;
      n.classList.add('is-in');
    });
    nodes.forEach(function (n, key) { if (!seen[key]) { n.remove(); nodes.delete(key); } });
    // One layout for all of them, then every mark that moved glides to its new place.
    void marksEl.offsetWidth;
    nodes.forEach(function (n) { n.classList.remove('is-still'); });
    glide.forEach(function (g) { moveTo(g[0], g[1], g[2]); });
  }

  // A mark explains itself when the pointer is over it. Clicks still go to the browser.
  window.addEventListener('mousemove', function (ev) {
    var hit = null;
    for (var i = 0; i < current.length; i++) {
      var m = current[i];
      if (m.pending || m._cx == null) continue;
      if (Math.abs(ev.clientX - (m._cx + shiftX)) <= 15 && Math.abs(ev.clientY - (m._cy + shiftY)) <= 15) { hit = m; break; }
    }
    if (!hit) { tip.classList.remove('is-on'); return; }
    var color = hit.badge ? M.COLORS[hit.badge] : M.COLORS.clear;
    tip.style.setProperty('--c', color);
    tip.querySelector('b').textContent = hit.badge ? hit.label : 'Nothing found';
    tip.querySelector('span').textContent = hit.badge ? (hit.reason || 'Open it with care.') : 'Sentinel checked this address and found no warning signs.';
    var cx = hit._cx + shiftX;
    var cy = hit._cy + shiftY;
    var left = Math.min(window.innerWidth - 312, Math.max(8, cx - 150));
    var top = cy + 20;
    if (top + 90 > window.innerHeight) top = cy - 84;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.classList.add('is-on');
  });
  window.addEventListener('mouseleave', function () { tip.classList.remove('is-on'); });

  var api = window.sentinelOverlay;
  api.on('overlay:watching', function (s) {
    corner.classList.add('is-on');
    corner.classList.toggle('is-quiet', Boolean(s.fullscreen));
    if (!flagged) setCorner('scam', GOLD);
    if (s.private) say('<b>Private window.</b> Protected, and nothing is kept.', '#e2c47f');
    else if (s.appeared) say('<b>Sentinel is scanning</b> this browser.', '#e2c47f');
  });
  api.on('overlay:sweep', function () { sweep(); });
  api.on('overlay:verdict', function (v) {
    flagged = Boolean(v && (v.badge === 'red' || v.badge === 'orange' || v.badge === 'yellow'));
    corner.classList.toggle('is-flagged', flagged);
    if (flagged) {
      var color = M.COLORS[v.badge];
      setCorner(v.kind, color);
      say('<b>' + esc(v.label) + '.</b> ' + (v.badge === 'yellow' ? 'Take care on this page.' : 'Do not enter anything here.'), color, v.badge !== 'yellow');
    } else {
      setCorner('scam', GOLD);
      // A warning about the last page must not hang over this one.
      if (sticky) { sticky = false; cornerLabel.classList.remove('is-on'); }
    }
  });
  // The page moved since these marks were placed: move the whole layer with it, in this frame. A new set of
  // positions (a new epoch) starts from zero again.
  var epoch = 0;
  var shiftX = 0;
  var shiftY = 0;
  function setShift(dx, dy) { shiftX = dx; shiftY = dy; marksEl.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0)'; }

  // The reader reports how far the page has moved whenever it gets an answer from the browser: at uneven moments,
  // not once per frame. Jumping to each report is what made scrolling look choppy. Instead every frame eases the
  // marks toward the page, and a little ahead of the last report by the page's speed (the report is already a few
  // milliseconds old when it arrives). The look-ahead fades as soon as reports stop, so marks never overshoot a
  // page that has stopped.
  var LEAD_MS = 22;        // how far ahead of the last report, at most
  var EASE_MS = 26;        // how quickly the marks close the gap (time constant)
  var goal = { x: 0, y: 0, t: 0 };
  var vel = { x: 0, y: 0 };
  var clockGap = null;     // this page's clock minus the reader's clock (their difference, plus the shortest delay seen)
  var frameAt = 0;
  var raf = 0;
  function readerNow() { return performance.now() - (clockGap || 0); }
  function follow(p) {
    var now = performance.now();
    var t = typeof p.t === 'number' ? p.t : now - (clockGap || 0);
    var gap = now - t;
    if (clockGap === null || gap < clockGap || gap - clockGap > 2000) clockGap = gap;
    var dt = t - goal.t;
    if (goal.t && dt > 0 && dt < 150) {
      // Speed in pixels per millisecond, smoothed over the last few reports.
      vel.x = vel.x * 0.5 + ((p.dx - goal.x) / dt) * 0.5;
      vel.y = vel.y * 0.5 + ((p.dy - goal.y) / dt) * 0.5;
    } else { vel.x = 0; vel.y = 0; }
    goal = { x: p.dx, y: p.dy, t: t };
    if (tracing) console.log('R ' + now.toFixed(1) + ' ' + t + ' ' + p.dy.toFixed(1));
    if (!raf) { frameAt = performance.now(); raf = requestAnimationFrame(frame); }
  }
  function frame(ts) {
    var since = readerNow() - goal.t;
    // Ahead by up to LEAD_MS while reports keep coming; no look-ahead once they have stopped for a moment.
    var lead = since < 60 ? Math.min(Math.max(since, 0), LEAD_MS) * Math.max(0, 1 - Math.max(0, since - 30) / 30) : 0;
    var tx = goal.x + vel.x * lead;
    var ty = goal.y + vel.y * lead;
    var step = Math.min(Math.max(ts - frameAt, 0), 50); frameAt = ts;
    var k = 1 - Math.exp(-step / EASE_MS);
    var nx = shiftX + (tx - shiftX) * k;
    var ny = shiftY + (ty - shiftY) * k;
    if (lead === 0 && Math.abs(goal.x - nx) < 0.4 && Math.abs(goal.y - ny) < 0.4) { setShift(goal.x, goal.y); raf = 0; return; }
    setShift(nx, ny);
    if (tracing) console.log('F ' + ts.toFixed(1) + ' ' + ny.toFixed(1) + ' ' + goal.y.toFixed(1));
    raf = requestAnimationFrame(frame);
  }
  function stopFollowing() { if (raf) cancelAnimationFrame(raf); raf = 0; goal = { x: 0, y: 0, t: 0 }; vel = { x: 0, y: 0 }; }
  var clipEl = document.getElementById('clip');
  function setClip(c) {
    // A little room above and below, so a mark on the first or last row is not cut in half.
    clipEl.style.clipPath = c ? 'inset(' + Math.max(0, Math.round(c.top - 6)) + 'px 0 ' + Math.max(0, Math.round(window.innerHeight - c.bottom - 6)) + 'px 0)' : '';
  }
  api.on('overlay:marks', function (p) {
    setClip(p && p.clip);
    var rebase = null;
    if (!p || p.epoch !== epoch) { rebase = { dx: shiftX, dy: shiftY }; epoch = p ? p.epoch : 0; stopFollowing(); setShift(0, 0); }
    place((p && p.marks) || [], rebase);
  });
  api.on('overlay:shift', function (p) {
    if (!p || p.epoch !== epoch) return;
    if (reduceMotion) { setShift(p.dx, p.dy); return; }
    follow(p);
  });
  api.on('overlay:clear', function () { stopFollowing(); setShift(0, 0); clearMarks(); corner.classList.remove('is-on'); cornerLabel.classList.remove('is-on'); flagged = false; });
})();
</script>
</body>
</html>
