<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:">
<title>Sentinel live scanning</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e9e6df; }
  * { box-sizing: border-box; }
  body { position: relative; }

  /* The tint and the line */
  .tint { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(214, 178, 90, .17), rgba(214, 178, 90, .07) 60%, rgba(214, 178, 90, .04)); }
  .line { position: absolute; left: 0; right: 0; top: 0; height: 3px; opacity: 0; pointer-events: none; will-change: transform;
    background: linear-gradient(90deg, rgba(233, 207, 138, 0), #e2c47f 18%, #fff4d2 50%, #e2c47f 82%, rgba(233, 207, 138, 0));
    box-shadow: 0 0 22px 5px rgba(214, 178, 90, .5), 0 0 3px 1px rgba(255, 244, 210, .8); }
  .line::before { content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 140px;
    background: linear-gradient(0deg, rgba(214, 178, 90, .16), rgba(214, 178, 90, 0)); }
  body.sweeping .tint { animation: tint 2.7s ease-out forwards; }
  body.sweeping .line { animation: line 1.35s cubic-bezier(.45, .05, .25, 1) forwards; }
  @keyframes tint { 0% { opacity: 0; } 12% { opacity: 1; } 55% { opacity: .85; } 100% { opacity: 0; } }
  @keyframes line { 0% { transform: translateY(-6px); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }

  /* The corner island: what Sentinel knows about the page in front. One shape for everything it does: at rest a pill
     (the mask and a few true words), with something to say it springs to the words' width, on a resting pointer or the
     keyboard it springs up into the panel, and a warning card (pages/card.js) opens out of its mask with the same curve.
     The shape is one clip, inset(... round ...), from three numbers (--w, --h, --r, in px): no frame lays anything out
     and nothing inside is scaled, so the words stay crisp at any display scale. A clip transition starts from wherever
     the last one had got to, so opening and closing can interrupt each other. Nothing loops; at rest nothing runs. */
  :root { --spring: linear(0, 0.063, 0.207, 0.382, 0.555, 0.706, 0.828, 0.918, 0.98, 1.018, 1.038, 1.046, 1.045, 1.039, 1.031, 1.023, 1.016, 1.009, 1); }
  .corner { position: absolute; right: 18px; bottom: 18px; width: 360px; height: 280px; --w: 34; --h: 34; --r: 17;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .34));
    opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; pointer-events: none; }
  /* The rim is the fill's own shape one pixel wider: a border would be cut off by the clip. Its own dark tone keeps the
     edge on black pages, and the fill is solid, so the words read the same on any page. */
  .isl__rim, .isl__sheet { position: absolute; clip-path: inset(calc(280px - var(--h) * 1px) 0 0 calc(360px - var(--w) * 1px) round calc(var(--r) * 1px)); transition: clip-path .5s var(--spring); }
  .isl__rim { inset: 0; background: color-mix(in srgb, var(--c, #d6b25a) 46%, #3a3b40); }
  .isl__sheet { inset: 1px; clip-path: inset(calc(280px - var(--h) * 1px) 0 0 calc(360px - var(--w) * 1px) round calc((var(--r) - 1) * 1px)); background: #0c0d10; }
  /* Getting smaller: no bounce, once the words have gone. */
  .corner.is-folding .isl__rim, .corner.is-folding .isl__sheet { transition: clip-path .34s cubic-bezier(.3, 0, .2, 1) .06s; }
  .corner.is-on { opacity: 1; transform: none; }
  /* Fullscreen video: out of the way, unless the page is dangerous. */
  .corner.is-on.is-quiet:not(.is-flagged) { opacity: 0; }
  /* After saying hello (and after each new page) it settles back: still there, a little quieter. A dangerous page keeps
     it at full strength. */
  .corner.is-on.is-rested:not(.is-flagged) { opacity: .86; transition-duration: .6s; }
  /* The pointer near it: the page's own corner buttons ("Share feedback", "Back to top", chat bubbles) can be seen, and
     every click still goes to them. Only a pointer that rests on the island opens it. */
  .corner.is-on.is-shy { opacity: .12; transition-duration: .18s; }
  .corner__mask { position: absolute; right: 4px; bottom: 4px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; color: var(--c, #d6b25a); }
  /* A glow that breathes twice when the mask arrives (and stays lit on a dangerous page), then stops: opacity only,
     and never an endless loop over a game or a page being read. */
  .corner__mask::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; box-shadow: 0 0 12px 1px color-mix(in srgb, var(--c, #d6b25a) 40%, transparent); opacity: 0; }
  .corner.is-on:not(.is-quiet):not(.is-rested) .corner__mask::after { animation: breathe 1.8s ease-in-out 2; }
  .corner.is-on.is-flagged .corner__mask::after { animation: breathe 1.8s ease-in-out 1.5 forwards; }   /* 1.5 runs: it ends lit */
  .corner__mask svg { width: 24px; height: 24px; display: block; }
  /* The words sit left of the mask. Each message is its own line: the old one rises out as the new one rises in, while
     the pill springs to the new width. They show once it is nearly open (at 160 ms they still stood out past its edge
     in the e2e frames). */
  .corner__label { position: absolute; right: 34px; bottom: 0; height: 32px; color: #e9e6df; font-size: 12px; font-weight: 500; }
  .corner__label > span { position: absolute; right: 0; top: 50%; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translate(10px, -50%); transition: opacity .2s ease .16s, transform .5s var(--spring) .04s; }
  .corner__label > span.is-in { opacity: 1; transform: translate(0, -50%); }
  .corner__label > span.is-swap { transition-delay: .07s, 0s; }
  .corner__label > span.is-out { opacity: 0; transform: translate(0, calc(-50% - 7px)); transition: opacity .14s ease, transform .2s ease; }
  .corner__label b { font-weight: 600; color: var(--c, #e2c47f); }
  @keyframes breathe { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  /* The panel: the pill row stays where it is at the bottom, and the panel's lines rise above it. Hidden, it takes no
     focus and a screen reader skips it. */
  .panel { position: absolute; right: 0; bottom: 0; width: 318px; box-sizing: border-box; padding: 14px 16px 38px; visibility: hidden; opacity: 0; outline: 0;
    transform: translateY(6px); transition: opacity .12s ease, transform .2s ease, visibility 0s linear .12s; }
  .corner.is-open .isl__sheet { pointer-events: auto; }
  .corner.is-open .panel { visibility: visible; opacity: 1; transform: none; transition: opacity .2s ease .1s, transform .5s var(--spring) .04s; }
  .panel p { margin: 0; }
  .panel__site { font: 12px/1.35 "Cascadia Mono", ui-monospace, Consolas, monospace; color: #b9b5ab; overflow-wrap: anywhere; }
  .panel__verdict { margin-top: 2px !important; font-size: 15px; line-height: 1.3; font-weight: 600; letter-spacing: -.005em; color: var(--c, #e9e6df); }
  .panel__why { margin-top: 3px !important; font-size: 12.5px; line-height: 1.4; color: #cfcbc1; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .panel__links { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px solid rgba(255, 255, 255, .08); display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: #cfcbc1; font-variant-numeric: tabular-nums; }
  .panel__links li { display: flex; align-items: center; gap: 5px; }
  .panel__links li::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c, #8d8a82); }
  .panel__links b { font-weight: 600; color: #e9e6df; }
  .panel__row { display: flex; gap: 8px; margin-top: 12px; }
  .panel__row button { flex: 1 1 0; height: 30px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 9px; cursor: pointer; font: 500 12px system-ui, -apple-system, "Segoe UI", sans-serif; color: #e9e6df; background: #1a1c21; white-space: nowrap; transition: transform .1s ease, background .12s ease; }
  .panel__row button:hover { background: #24272d; }
  .panel__row button:active { transform: scale(.97); }
  .panel__row button:focus-visible { outline: 2px solid #e2c47f; outline-offset: 1px; }
  .panel__key { margin-top: 8px !important; font-size: 11px; color: #a09c93; }
  [hidden] { display: none !important; }
  /* Windows High Contrast: the island keeps its own dark fill and gold, as the marks do. */
  @media (forced-colors: active) { .corner { forced-color-adjust: none; } }

  /* A mask beside every result. The layer moves with the page between reads (see overlay:shift). */
  /* The clip stays where the message list is; the marks inside it move with the page. */
  #clip { position: absolute; inset: 0; }
  #marks { position: absolute; inset: 0; will-change: transform, opacity; transition: opacity .16s ease; }
  /* While the page is really moving the marks step aside (see overlay:shift), and come back in place once it stops. */
  #marks.is-moving { opacity: 0; transition: opacity .09s ease; }
  .mark { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: 0; display: grid; place-items: center; border-radius: 8px; pointer-events: none;
    background: rgba(12, 13, 16, .88); box-shadow: 0 2px 10px rgba(0, 0, 0, .28), 0 0 12px -2px color-mix(in srgb, var(--c, #8f8a7a) 55%, transparent); border: 1px solid color-mix(in srgb, var(--c, #8f8a7a) 50%, transparent); color: var(--c, #8f8a7a);
    opacity: 0; scale: .6; will-change: transform; transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
  .mark.is-still { transition: none; }
  /* A flagged result: its mask in cast gold, the corner seal's shape saying how bad (masks.js mark()). */
  .mark svg { width: 24px; height: 24px; display: block; }
  .mark.is-red { border-width: 2px; }
  /* Checked, nothing found: only a small tick, no tile and no mask, so an honest page of results stays calm. */
  .mark.is-clear { width: 20px; height: 20px; background: none; border: 0; box-shadow: none; }
  .mark.is-clear svg { width: 16px; height: 16px; }
  /* Windows High Contrast would flatten every mark into one outlined square: the marks keep their own dark tile,
     gold and seal shapes, which carry the meaning without hue. */
  @media (forced-colors: active) { .mark { forced-color-adjust: none; } }
  .mark.is-pending { width: 10px; height: 10px; border-radius: 3px; border: 0; box-shadow: none; background: #d6b25a; opacity: .0; animation: wait 1s ease-in-out infinite; }
  .mark.is-in { animation: pop .34s cubic-bezier(.2, 1.4, .4, 1) var(--d, 0ms) forwards; }
  @keyframes pop { 0% { opacity: 0; scale: .55; } 100% { opacity: 1; scale: 1; } }
  /* A mark that has popped in once just shows when it comes back (scrolled away and back, or its verdict refined). */
  .mark.is-on { opacity: 1; scale: 1; }
  @keyframes wait { 0%, 100% { opacity: .25; } 50% { opacity: .8; } }

  .tip { position: absolute; max-width: 300px; padding: 9px 12px; border-radius: 9px; background: rgba(12, 13, 16, .95); border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); opacity: 0; transition: opacity .15s ease; pointer-events: none; z-index: 5; }
  .tip.is-on { opacity: 1; }
  .tip b { display: block; font-weight: 600; color: var(--c, #e9e6df); margin-bottom: 2px; }
  .tip span { color: #b9b5ab; font-size: 12.5px; }

  /* Before you pay: a calm card at the top right of a shop's checkout whose address is young or unknown. It springs in
     (transforms and opacity only) and stays while the page does; the pointer near it makes it step aside, like the
     corner mask, so the page under it can be read and clicked. */
  .pay { position: absolute; right: 18px; top: 18px; width: 300px; padding: 12px 14px 12px 50px; border-radius: 12px; background: #0c0d10;
    border: 1px solid color-mix(in srgb, #d6b25a 34%, transparent); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); pointer-events: none;
    opacity: 0; transform: translateY(-8px) scale(.97); transform-origin: 100% 0; transition: opacity .22s ease, transform .5s var(--spring); }
  .pay.is-on { opacity: 1; transform: none; }
  .pay.is-on.is-shy { opacity: .12; transition-duration: .18s; }
  .pay__mask { position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; color: #d6b25a; }
  .pay__mask svg { width: 26px; height: 26px; display: block; }
  .pay b { display: block; font-weight: 600; color: #e2c47f; margin-bottom: 3px; }
  .pay span { color: #cfcbc1; font-size: 12.5px; }

  @media (prefers-reduced-motion: reduce) {
    .pay, .pay.is-on { transform: none; transition: opacity .2s ease; }
    body.sweeping .line { animation: none; }
    body.sweeping .tint { animation: tint 1.2s ease-out forwards; }
    /* Calm: the card still opens and the words still change (that is the message), with no spring and no travel. */
    .corner.is-on:not(.is-quiet):not(.is-rested) .corner__mask::after, .corner.is-on.is-flagged .corner__mask::after { animation: none; }
    .corner.is-on.is-flagged .corner__mask::after { opacity: .7; }
    .isl__rim, .isl__sheet, .corner.is-folding .isl__rim, .corner.is-folding .isl__sheet { transition: none; }
    .corner, .corner.is-on { transform: none; transition: opacity .2s ease; }
    .panel, .corner.is-open .panel { transform: none; transition: opacity .2s ease, visibility 0s linear .2s; }
    .corner.is-open .panel { transition: opacity .2s ease; }
    .panel__row button:active { transform: none; }
    .corner__label > span, .corner__label > span.is-in, .corner__label > span.is-out { transform: translate(0, -50%); transition: opacity .2s ease; }
    .mark.is-in { animation: none; opacity: 1; scale: 1; }
    .mark.is-pending { animation: none; opacity: .5; }
  }
</style>
</head>
<body>
  <div class="tint"></div>
  <div class="line"></div>
  <div id="clip"><div id="marks"></div></div>
  <div class="tip" id="tip"><b></b><span></span></div>
  <div class="pay" id="pay" role="status"><i class="pay__mask" id="payMask"></i><b>Before you pay</b><span id="payText"></span></div>
  <div class="corner" id="corner" role="region" aria-label="Sentinel, this page">
    <i class="isl__rim"></i>
    <div class="isl__sheet">
      <div class="panel" id="panel" tabindex="-1" aria-labelledby="panelSite panelVerdict" aria-describedby="panelWhy">
        <p class="panel__site" id="panelSite"></p>
        <p class="panel__verdict" id="panelVerdict"></p>
        <p class="panel__why" id="panelWhy"></p>
        <ul class="panel__links" id="panelLinks" aria-label="Links on this page"></ul>
        <div class="panel__row">
          <button type="button" id="panelPause"></button>
          <button type="button" id="panelOpen">Open Sentinel</button>
        </div>
        <p class="panel__key" id="panelKey"></p>
      </div>
      <div class="corner__label" id="cornerLabel"></div>
      <div class="corner__mask" id="cornerMask"></div>
    </div>
  </div>
<script src="../../shared/masks.js"></script>
<script src="../../shared/binary.js"></script>
<script>
(function () {
  'use strict';
  var M = window.SentinelMasks;
  var GOLD = '#d6b25a';
  var tracing = /[?&]trace=1\b/.test(location.search);   // end-to-end runs only (see overlay.js)
  var corner = document.getElementById('corner');
  var cornerMask = document.getElementById('cornerMask');
  var cornerLabel = document.getElementById('cornerLabel');
  var marksEl = document.getElementById('marks');
  var tip = document.getElementById('tip');
  var pay = document.getElementById('pay');
  document.getElementById('payMask').innerHTML = M.svg('scam');
  // One element per result, kept by the result's key: when scrolling brings new results in and takes others out,
  // the marks that stay are the same elements, untouched, and only newcomers pop in.
  var nodes = new Map();
  // Results whose mark has already popped in. Scrolling re-reads the page, and a mark that left the screen and came
  // back, or whose quick verdict was replaced by the researched one, was popping in again after every scroll.
  var shown = new Set();
  var current = [];
  var labelTimer = null;
  var sweepTimer = null;
  var flagged = false;
  var sticky = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // The island's shape in px. The pointer tests below use the same numbers, so nothing is read from the page.
  var PILL = 34;           // its height, and its width with the mask alone; pages/card.js opens from this
  var PANEL_W = 320;
  var EDGE = 18;           // in from the page's corner; main.js islandCorner() is the same number
  var islandW = PILL;
  var islandH = PILL;
  function island(w, h, r) {
    h = h || PILL;
    corner.classList.toggle('is-folding', w * h < islandW * islandH);
    islandW = w; islandH = h;
    corner.style.setProperty('--w', String(w));
    corner.style.setProperty('--h', String(h));
    corner.style.setProperty('--r', String(r || PILL / 2));
  }
  function leave(s) {
    s.classList.remove('is-in'); s.classList.add('is-out');
    // Gone once its way out has played.
    setTimeout(function () { s.remove(); }, 260);
  }

  var shownWords = null;
  /** The pill's words: the old line leaves, the new one comes in, and the pill springs to its width. */
  function words(html, color) {
    if (html === shownWords) return;
    shownWords = html;
    cornerLabel.querySelectorAll(':scope > span:not(.is-out)').forEach(leave);
    if (!html) { if (!panelOpen) island(PILL); return; }
    var s = document.createElement('span');
    s.style.setProperty('--c', color || '#e2c47f');
    s.innerHTML = html;
    // Already wide: the new words come in sooner, as the old ones leave (the pill only changes width).
    if (islandW > PILL) s.classList.add('is-swap');
    cornerLabel.appendChild(s);
    // One layout read per message (its width), which also fixes the start state, so the class below transitions.
    var w = Math.min(s.offsetWidth, 300) + PILL + 12;
    if (!panelOpen) island(w);
    s.classList.add('is-in');
  }
  /** Words of the moment. They leave by themselves unless `keep` (a warning stays while its page does). */
  function say(html, color, keep) {
    clearTimeout(labelTimer);
    labelTimer = null;
    words(html, color);
    sticky = Boolean(keep);
    if (!keep) labelTimer = setTimeout(hush, 4200);
  }
  /** Back to the resting words. */
  function hush() {
    clearTimeout(labelTimer);
    labelTimer = null;
    sticky = false;
    var r = rest();
    words(r.html, r.color);
  }
  // The desktop end-to-end run (scripts/desktop-e2e.ps1) replays the island through these to photograph it mid-spring.
  window.sentinelIsland = { say: say, hush: hush, open: function () { openPanel(false); }, close: closePanel, takesPointer: function () { return interactive; } };

  /*
   * What the island knows about the page in front. All of it comes from the app as it happens (overlay:page,
   * overlay:verdict, overlay:marks), and it starts empty on every page: what is not known is not shown.
   */
  var site = null;         // set on overlay:page: { host, private, search, paused, checking, label, badge, why, unchecked }
  var keyHint = '';        // the keyboard shortcut, when Windows gave it to Sentinel
  var lockedNote = false;  // the parent lock refused a pause
  var seenLinks = new Map();   // this page's results and links, by their hashed key: what the last read said of each
  function newSite(p) {
    return { host: (p && p.host) || null, private: Boolean(p && p.private), search: Boolean(p && p.search), paused: Boolean(p && p.paused),
      checking: Boolean(p && !p.search && !p.paused), label: '', badge: null, why: '', unchecked: false };
  }
  function linkCounts() {
    var c = { red: 0, orange: 0, yellow: 0, clear: 0, pending: 0 };
    seenLinks.forEach(function (tier) { c[tier]++; });
    return c;
  }
  var WORST = ['red', 'orange', 'yellow'];
  /** The pill's words at rest: the page's own verdict if it is bad, then the links on it, then what the scanner said. */
  function rest() {
    var c = linkCounts();
    var flaggedLinks = c.red + c.orange + c.yellow;
    if (site && site.badge) return { html: '<b>' + esc(site.label) + '</b>', color: M.COLORS[site.badge] };
    if (site && site.paused) return { html: 'Paused here' };
    if (flaggedLinks) {
      var worst = WORST.filter(function (b) { return c[b]; })[0];
      return { html: '<b>' + flaggedLinks + ' flagged</b>', color: M.COLORS[worst] };
    }
    // A results page has no verdict of its own: its links are its news. A hovered link does not unsay a page's verdict.
    if (!site || !site.label || site.search) {
      if (c.pending) return { html: 'Checking links' };
      if (c.clear) return { html: c.clear + (c.clear === 1 ? ' link checked' : ' links checked') };
    }
    if (site && site.checking) return { html: 'Checking' };
    if (site && site.unchecked) return { html: 'Not checked' };
    if (site && site.label && !site.search) return { html: esc(site.label) };
    return { html: 'Watching' };
  }
  /** The app has news: new resting words (unless a message is being said), and the panel if it is open. */
  function refresh() {
    if (!labelTimer && !sticky) { var r = rest(); words(r.html, r.color); }
    if (panelOpen) { fillPanel(); island(PANEL_W, panel.offsetHeight, 18); }
  }

  var panel = document.getElementById('panel');
  var panelPause = document.getElementById('panelPause');
  var panelApp = document.getElementById('panelOpen');
  var panelOpen = false;
  var byKeyboard = false;
  var LINK_ROWS = [['red', null], ['orange', null], ['yellow', null], ['clear', 'Nothing found'], ['pending', 'Being checked']];
  function fillPanel() {
    var s = site || newSite(null);
    var color = s.badge ? M.COLORS[s.badge] : '';
    panel.style.setProperty('--c', color || '#e9e6df');
    document.getElementById('panelSite').textContent = s.host || (s.private ? 'Private window' : 'This browser');
    document.getElementById('panelVerdict').textContent = s.badge ? (M.SEVERITY[s.badge] || 'Caution') + ': ' + s.label
      : s.paused ? 'Paused here' : s.checking ? 'Checking this site' : s.unchecked ? 'Could not check this site' : s.label || 'Watching this browser';
    var why = document.getElementById('panelWhy');
    // A private window's reason can name the site: the panel stays with the verdict.
    why.textContent = s.paused ? 'Pages and links here are not checked for up to an hour.'
      : lockedNote ? 'Locked by a parent. Unlock it with the PIN in Sentinel.' : s.private ? '' : s.why;
    why.hidden = !why.textContent;
    var list = document.getElementById('panelLinks');
    var c = linkCounts();
    list.textContent = '';
    LINK_ROWS.forEach(function (row) {
      if (!c[row[0]]) return;
      var li = document.createElement('li');
      li.style.setProperty('--c', row[0] === 'pending' ? '#8d8a82' : M.COLORS[row[0]]);
      var b = document.createElement('b'); b.textContent = String(c[row[0]]);
      li.appendChild(b);
      li.appendChild(document.createTextNode(' ' + (row[1] || M.SEVERITY[row[0]])));
      list.appendChild(li);
    });
    list.hidden = !(c.red + c.orange + c.yellow + c.clear + c.pending);
    // Only a site checked and found clean can be paused: a flagged page never can, whoever is on the phone asking.

        if (tracing) console.log('F ' + ts.toFixed(1) + ' ' + shiftY.toFixed(1) + ' wheel');
        raf = requestAnimationFrame(frame);
        return;
      }
    }
    var k = 1 - Math.exp(-step / (pxActive(now) ? PX_EASE_MS : EASE_MS));
    var nx = shiftX + (goal.x - shiftX) * k;
    var ny = shiftY + (goal.y - shiftY) * k;
    if (Math.abs(goal.x - nx) < 0.4 && Math.abs(goal.y - ny) < 0.4) { setShift(goal.x, goal.y); raf = 0; return; }

    if (tracing) console.log('F ' + ts.toFixed(1) + ' ' + ny.toFixed(1) + ' ' + goal.y.toFixed(1));

  function setClip(c) {

    clipEl.style.clipPath = c ? 'inset(' + Math.max(0, Math.round(c.top - 6)) + 'px 0 ' + Math.max(0, Math.round(window.innerHeight - c.bottom - 6)) + 'px 0)' : '';

      // Starting again is what threw marks off the page mid-scroll: the next report was applied a second time.

      place((p && p.marks) || [], null, true);

  });

    // keeping marks on their results, not a decorative animation, and jumping is what looks broken.
    if (!p || p.epoch !== epoch) return;
    follow(p);
  });
  api.on('overlay:wheel', function (p) { if (p && p.epoch === epoch) onWheel(p); });
  api.on('overlay:px', function (p) { if (p && p.epoch === epoch) onPixels(p); });
  // Before you pay: the words come from the scanner (plain text), or null when the page in front is not such a checkout.
  api.on('overlay:pay', function (p) {
    document.getElementById('payText').textContent = p && p.text ? String(p.text) : '';
    pay.classList.toggle('is-on', Boolean(p && p.text));
  });
  api.on('overlay:clear', function () { pay.classList.remove('is-on'); endDig(); stopFollowing(); setShift(0, 0); setMoving(false); clearMarks(); closePanel(); corner.classList.remove('is-on'); site = null; seenLinks.clear(); hush(); flagged = false; });
})();
