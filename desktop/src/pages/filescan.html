<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; font-src file:; script-src 'unsafe-inline' file:">
<title>Sentinel</title>
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<script src="motion.js"></script>
<script src="card.js"></script>
<style>
  /* This window opens from the person's own files, so it follows their theme as the app does. The warnings that open
     over a web page stay dark: they have to look the same over any site. */
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="light"] body { color: #2b2720; background: radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--c) 8%, transparent), transparent 62%), #f6f1e7; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 6px 12px rgba(60, 45, 20, .22); }
  :root[data-theme="light"] .name { color: #4a453a; }
  :root[data-theme="light"] .body p, :root[data-theme="light"] ul { color: #4a453a; }
  :root[data-theme="light"] .body b { color: #2b2720; }
  :root[data-theme="light"] small { color: #6b6558; }
  :root[data-theme="light"] button:not(.primary) { color: #2b2720; background: #ebe4d5; border-color: rgba(60, 45, 20, .12); }
  :root[data-theme="light"] button:not(.primary):hover { background: #e2dac8; }
  :root[data-theme="light"] button:focus-visible { outline-color: #8a6424; }
</style>
</head>
<body role="dialog" aria-labelledby="label" aria-describedby="name lead found">
  <div class="head">
    <div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M32 11.6c-5.6 0-10.4 1.8-12.6 5C18.4 18.1 18 19.9 18 21.8v7.8c0 3.8 1.2 7 3.4 9.8L32 49.4l10.6-10c2.2-2.8 3.4-6 3.4-9.8v-7.8c0-1.9-.4-3.7-1.4-5.2-2.2-3.2-7-5-12.6-5ZM21 23.4l8 3-.5 3.6-7.5-1.8ZM43 23.4l-8 3 .5 3.6 7.5-1.8ZM24.6 32l4.6 1.1v8.4l-3-3.4ZM39.4 32l-4.6 1.1v8.4l3-3.4Z"/></svg></div>
    <div>
      <h1 id="label">Not checked</h1>
      <p class="name" id="name"></p>
    </div>
  </div>
  <div class="body">
    <p id="lead"></p>
    <ul id="found"></ul>
    <p id="deeper">For a deeper check, sign in. Sentinel then also compares the file with its list of known threats.</p>
    <small id="where">Checked on this computer. Nothing about the file left it.</small>
  </div>
  <div class="row">
    <button id="signin">Sign in for a deeper check</button>
    <button class="primary" id="close" data-escape>Done</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const badge = q.get('badge') || 'none';
    const chosen = q.get('theme');
    const light = chosen ? chosen === 'light' : matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    const color = (light
      ? { red: '#b3261e', orange: '#b04a00', yellow: '#8a6100', green: '#1a6e35', part: '#7a5818' }
      : { red: '#e5484d', orange: '#f08a24', yellow: '#f5c542', green: '#46a758', part: '#c9a227' })[badge];
    document.documentElement.style.setProperty('--c', color || (light ? '#6b6558' : '#8d8a82'));
    // A file found harmful is a warning: said as one to a screen reader.
    if (badge === 'red' || badge === 'orange') document.body.setAttribute('role', 'alertdialog');
    document.getElementById('label').textContent = q.get('label') || 'Not checked';
    const size = Number(q.get('size')) || 0;
    // An empty or tiny file is not "1 KB".
    const kb = size < 1024 ? `${size} byte${size === 1 ? '' : 's'}` : size < 1024 * 1024 ? `${Math.round(size / 1024)} KB` : `${(size / 1024 / 1024).toFixed(1)} MB`;
    document.getElementById('name').textContent = `${q.get('name') || ''} · ${kb}`;
    const why = q.get('why');
    const lead = document.getElementById('lead');
    const where = document.getElementById('where');
    if (q.get('asked') === '1') where.textContent = 'The file stayed on this computer. Only its fingerprint was compared with the list of known threats.';
    else if (why) where.textContent = 'Nothing about the file left this computer.';
    // Signing in compares the file with the list. Signed in already, or with nothing to compare, it cannot help.
    if (q.get('account') === '1' || badge === 'none') { document.getElementById('deeper').hidden = true; document.getElementById('signin').hidden = true; }
    if (why) {
      lead.textContent = why;
    } else if (badge === 'green') {
      lead.textContent = 'Sentinel found nothing harmful in this file.';
    } else {
      lead.innerHTML = badge === 'red'
        ? '<b>Do not open this file.</b> Delete it, unless you are sure where it came from.'
        : '<b>Be careful with this file.</b> Only open it if you know who made it and why you have it.';
    }
    const ul = document.getElementById('found');
    for (const f of (q.get('found') || '').split('\n').filter(Boolean).slice(0, 4)) {
      const li = document.createElement('li');
      li.textContent = f;
      if (ul.children.length) li.dataset.trim = '';
      ul.appendChild(li);
    }
    document.getElementById('close').onclick = () => window.sentinelDesktop.menuResultAction('close');
    document.getElementById('signin').onclick = () => window.sentinelDesktop.menuResultAction('signin');
    document.getElementById('close').focus();
  </script>
</body>
</html>
