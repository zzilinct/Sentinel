<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Sentinel</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #111215; color: #e9e6df; font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; padding: 22px 24px 20px; box-sizing: border-box; }
  .head { display: flex; align-items: center; gap: 14px; }
  .mark { width: 46px; height: 46px; flex: none; color: var(--c, #8d8a82); }
  .mark svg { width: 100%; height: 100%; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; color: var(--c, #8d8a82); }
  .name { margin: 2px 0 0; font: 13px ui-monospace, Consolas, monospace; color: #c9c5bb; overflow-wrap: anywhere; }
  .body { margin-top: 16px; min-height: 0; overflow-y: auto; }
  .body p { margin: 0 0 10px; color: #b9b5ab; }
  .body b { color: #e9e6df; font-weight: 500; }
  ul { margin: 0 0 10px; padding-left: 18px; color: #c9c5bb; }
  ul:empty { display: none; }
  li { margin: 4px 0; }
  small { display: block; margin-top: 12px; color: #8d8a82; font-size: 12px; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  button { height: 38px; padding: 0 16px; border: 0; border-radius: 11px; cursor: pointer; font: 500 13.5px system-ui, sans-serif; color: #e9e6df; background: #1e2126; }
  button.primary { color: #16130b; background: linear-gradient(180deg, #efd79c 0%, #d6b066 48%, #b88e3d 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 14px 34px -14px rgba(212,174,99,.75); }
  button:focus-visible { outline: 2px solid #e2c47f; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="head" role="status">
    <div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M32 11.6c-5.6 0-10.4 1.8-12.6 5C18.4 18.1 18 19.9 18 21.8v7.8c0 3.8 1.2 7 3.4 9.8L32 49.4l10.6-10c2.2-2.8 3.4-6 3.4-9.8v-7.8c0-1.9-.4-3.7-1.4-5.2-2.2-3.2-7-5-12.6-5ZM21 23.4l8 3-.5 3.6-7.5-1.8ZM43 23.4l-8 3 .5 3.6 7.5-1.8ZM24.6 32l4.6 1.1v8.4l-3-3.4ZM39.4 32l-4.6 1.1v8.4l3-3.4Z"/></svg></div>
    <div>
      <h1 id="label">Not checked</h1>
      <p class="name" id="name"></p>
    </div>
  </div>
  <div class="body">
    <p id="lead"></p>
    <ul id="found"></ul>
    <p id="deeper">For a deeper check, sign in. Sentinel then also compares the file with its list of known threats.</p>
    <small id="where">Checked on this computer. Nothing about the file left it.</small>
  </div>
  <div class="row">
    <button id="signin">Sign in for a deeper check</button>
    <button class="primary" id="close">Done</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const badge = q.get('badge') || 'none';
    const color = { red: '#e5484d', orange: '#f08a24', yellow: '#f5c542', green: '#46a758' }[badge];
    if (color) document.documentElement.style.setProperty('--c', color);
    document.getElementById('label').textContent = q.get('label') || 'Not checked';
    const size = Number(q.get('size')) || 0;
    // An empty or tiny file is not "1 KB".
    const kb = size < 1024 ? `${size} byte${size === 1 ? '' : 's'}` : size < 1024 * 1024 ? `${Math.round(size / 1024)} KB` : `${(size / 1024 / 1024).toFixed(1)} MB`;
    document.getElementById('name').textContent = `${q.get('name') || ''} · ${kb}`;
    const problem = q.get('problem');
    const lead = document.getElementById('lead');
    if (problem === 'big') {
      lead.textContent = 'This file is over 25 MB, more than Sentinel reads on this computer. Signed in, Sentinel can still look it up in its list of known threats.';
      document.getElementById('where').textContent = 'Nothing about the file left this computer.';
    } else if (problem) {
      lead.textContent = 'Sentinel could not open this file. It may have been moved, or another program may be using it.';
      document.getElementById('where').textContent = 'Nothing about the file left this computer.';
    } else if (badge === 'green') {
      lead.textContent = 'Sentinel found nothing harmful in this file.';
    } else {
      lead.innerHTML = badge === 'red'
        ? '<b>Do not open this file.</b> Delete it, unless you are sure where it came from.'
        : '<b>Be careful with this file.</b> Only open it if you know who made it and why you have it.';
    }
    const ul = document.getElementById('found');
    for (const f of (q.get('found') || '').split('\n').filter(Boolean).slice(0, 4)) {
      const li = document.createElement('li');
      li.textContent = f;
      ul.appendChild(li);
    }
    document.getElementById('close').onclick = () => window.sentinelDesktop.menuResultAction('close');
    document.getElementById('signin').onclick = () => window.sentinelDesktop.menuResultAction('signin');
    document.getElementById('close').focus();
  </script>
</body>
</html>
