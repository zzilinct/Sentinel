<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:">
<title>Sentinel chat safety</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #ece8df; }
  * { box-sizing: border-box; }
  /* The badge: chat is being watched. Small, in the corner, never over a game's play. */
  .badge { position: absolute; right: 14px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 7px; border-radius: 10px;
    background: rgba(12, 13, 16, .82); border: 1px solid rgba(214, 178, 90, .45); box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
    opacity: 0; transform: translateY(-6px); transition: opacity .3s ease, transform .3s ease; pointer-events: none; }
  .badge.is-on { opacity: 1; transform: none; }
  .badge svg { width: 18px; height: 18px; color: #d6b25a; display: block; }
  .badge span { font-size: 12px; color: #e2c47f; white-space: nowrap; }
  body.discord .badge, body.phonelink .badge { top: auto; bottom: 86px; }
  /* A warning, beside the message it is about. */
  .card { position: absolute; width: 300px; padding: 10px 12px 11px 40px; border-radius: 11px; background: rgba(14, 14, 18, .94);
    border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 0 16px -4px var(--c);
    animation: in .32s cubic-bezier(.2, 1.2, .4, 1) both; pointer-events: none; }
  .card svg { position: absolute; left: 10px; top: 11px; width: 22px; height: 22px; color: var(--c); }
  .card b { display: block; color: var(--c); font-size: 13px; margin-bottom: 2px; }
  .card .what { color: #ece8df; font-size: 12.5px; }
  .card .do { color: #b9b4a9; font-size: 11.5px; margin-top: 5px; }
  /* In a game: smaller, and only what matters, so the game stays the game. */
  body.roblox.in-game .card { width: 250px; padding: 8px 10px 9px 34px; }
  body.roblox.in-game .card .do { display: none; }
  body.roblox.in-game .card svg { width: 18px; height: 18px; left: 9px; top: 9px; }
  @keyframes in { from { opacity: 0; transform: translateX(-8px) scale(.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .badge { transition: none; } }
</style>
</head>
<body>
  <div class="badge" id="badge"><span id="badgeMask"></span><span id="badgeText">Sentinel is watching this chat</span></div>
  <div id="cards"></div>
<script src="../../shared/masks.js"></script>
<script>
(function () {
  'use strict';
  var M = window.SentinelMasks;
  var COLORS = { warn: '#f08a24', danger: '#e5484d' };
  var badge = document.getElementById('badge');
  var cards = document.getElementById('cards');
  document.getElementById('badgeMask').innerHTML = M.svg('logo');
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  window.sentinelChat.onState(function (s) {
    document.body.className = (s.app || '') + (s.inGame ? ' in-game' : '');
    badge.classList.toggle('is-on', Boolean(s.indicator));
    // Never claims to watch what it cannot read.
    document.getElementById('badgeText').textContent = s.app === 'phonelink'
      ? (s.reading === false ? 'Sentinel cannot read these texts yet' : 'Sentinel is checking these texts')
      : (s.reading === false ? 'Sentinel cannot read this chat yet' : 'Sentinel is watching this chat');
    var W = window.innerWidth, H = window.innerHeight;
    var html = '';
    var taken = [];
    (s.flags || []).forEach(function (f) {
      var r = f.rect || { x: 20, y: 20, w: 0, h: 0 };
      var w = s.app === 'roblox' && s.inGame ? 250 : 300;
      var x, y;
      if (s.app === 'roblox' && s.area) {
        // Beside the chat box, level with the message, never over the middle of the screen.
        x = Math.min(s.area.x + s.area.w + 10, W - w - 10);
        y = r.y;
      } else if (s.app === 'phonelink') {
        // Phone Link: just right of the text bubble, which sits on the left; on its left edge if there is no room.
        x = r.x + r.w + 12 + w <= W - 10 ? r.x + r.w + 12 : Math.max(10, W - w - 10);
        y = r.y;
      } else {
        // Discord: on the right of the message, where a message's own line is usually empty.
        x = Math.max(10, Math.min(r.x + r.w - w - 16, W - w - 10));
        y = r.y;
      }
      // Cards do not cover each other.
      taken.forEach(function (t) { if (Math.abs(t - y) < 74) y = t + 74; });
      y = Math.max(8, Math.min(y, H - 90));
      taken.push(y);
      html += '<div class="card" style="--c:' + (COLORS[f.level] || COLORS.warn) + ';left:' + Math.round(x) + 'px;top:' + Math.round(y) + 'px">'
        + M.svg(f.family === 'scam' ? 'scam' : 'malware') + '<b>' + esc(f.title) + '</b><div class="what">' + esc(f.detail) + '</div><div class="do">' + esc(f.advice) + '</div></div>';
    });
    if (cards.innerHTML !== html) cards.innerHTML = html;
  });
})();
</script>
</body>
</html>
