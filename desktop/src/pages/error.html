<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; font-src file:; script-src file:">
<title>Sentinel</title>
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<script src="../../shared/look.js"></script>
<script src="paint.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: var(--bg, #111215); color: var(--text, #e9e6df); font: var(--t-text)/var(--lh-lead) var(--sans); }
  body { display: grid; place-items: center; }
  .box { max-width: 460px; padding: 0 24px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 18px; color: #e5484d; }
  .mark svg { width: 100%; height: 100%; }
  h1 { margin: 0; font: 400 var(--t-title)/var(--lh-display) var(--display); }
  p { margin: 8px 0 0; color: var(--muted, #a9a59b); font-size: var(--t-ui); }
  code { display: block; margin: 14px 0 0; padding: 10px 12px; border-radius: 11px; background: #15171b; color: var(--text-2, #c9c5bb); font: var(--t-note)/1.5 var(--mono); text-align: left; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
  button { height: 40px; padding: 0 18px; border: 0; border-radius: 11px; cursor: pointer; font: 500 var(--t-ui) var(--sans); color: var(--text, #e9e6df); background: color-mix(in srgb, var(--text, #e9e6df) 9%, var(--bg, #111215)); }
  button.primary { color: var(--on-acc); background: var(--acc-grad); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 14px 34px -14px rgb(var(--acc-rgb) / .75); }
  button:focus-visible { outline: 2px solid var(--acc-hi); outline-offset: 2px; }
  small { display: block; margin-top: 16px; color: var(--faint, #8d8a82); font-size: var(--t-label); }
  @media (prefers-color-scheme: light) {
    html, body { background: var(--bg, #f6f4ef); color: var(--text, #1c1b18); }
    p { color: var(--muted, #55524b); }
    small { color: var(--faint, #6a675f); }
    code { background: color-mix(in srgb, var(--text, #1c1b18) 7%, var(--bg, #f6f4ef)); color: var(--text-2, #2e2c27); }
    button { color: var(--text, #1c1b18); background: color-mix(in srgb, var(--text, #1c1b18) 10%, var(--bg, #f6f4ef)); }
    .mark { color: #b3261e; }
  }
</style>
</head>
<body>
  <div class="box" role="alert">
    <div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M32 2.6 57.4 10v18.6c0 14.6-9.9 24.6-25.4 31.4C16.5 53.2 6.6 43.2 6.6 28.6V10Zm0 4.2L10.6 13v15.6c0 12.2 8 20.7 21.4 26.8 13.4-6.1 21.4-14.6 21.4-26.8V13Z"/><path fill="currentColor" d="M30 18h4v18h-4zM30 40h4v4h-4z"/></svg></div>
    <h1>Sentinel couldn't start its scanner</h1>
    <p id="msg">The built-in server didn't come up.</p>
    <code id="log"></code>
    <div class="row">
      <button class="primary" id="retry">Try again</button>
      <button id="logs">Open log</button>
      <button id="quit">Quit</button>
    </div>
    <small id="auto"></small>
    <small>If this keeps happening, send the log file to the Sentinel team.</small>
  </div>
  <script src="error-page.js"></script>
</body>
</html>
