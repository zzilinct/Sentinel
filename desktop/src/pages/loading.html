<title>Sentinel</title>
<style>
  html, body { height: 100%; margin: 0; background: #0c0d10; color: #e9e6df; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; }
  .box { text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; color: #d6b25a; }
  .mark svg { width: 100%; height: 100%; }
  h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
  p { margin: 6px 0 0; color: #8d8a82; font-size: 13.5px; }
  .bar { width: 160px; height: 3px; margin: 22px auto 0; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #d6b25a; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
