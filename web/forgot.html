<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<link rel="stylesheet" href="/assets/css/app.css">
<title>Reset your password · Sentinel</title>
<meta name="robots" content="noindex">
</head>
<body data-page="forgot">
<div class="auth">
  <!-- @include auth-art -->
  <main class="auth__form" id="main">
    <div class="auth__inner">
      <h1>Forgot your password?</h1>
      <p>Enter your account email and we’ll send you a link to choose a new one.</p>
      <div data-note></div>
      <form data-form data-draft="forgot" method="post" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn--gold btn--lg btn--block" type="submit">Send reset link</button>
      </form>
      <p class="auth__switch"><a href="/login">Back to sign in</a></p>
    </div>
    <!-- @include legal -->
  </main>
</div>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/reset.js"></script>
</body>
</html>
