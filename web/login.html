<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<link rel="stylesheet" href="/assets/css/app.css">
<title>Sign in · Sentinel</title>
<meta name="description" content="Sign in to Sentinel.">
</head>
<body>
<div class="auth">
  <section class="auth__form">
    <a class="logo" href="/"><span class="logo__mark" data-glyph="scam"></span>Sentinel</a>

    <div class="auth__inner" data-step="password">
      <h1>Welcome <span class="serif italic">back</span></h1>
      <p>Sign in to keep your protection running.</p>

      <div data-note></div>
      <!-- @include google-button -->
      <div class="divider">or</div>

      <form data-form novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <span class="field__error" data-error="email"></span>
        </div>
        <div class="field">
          <label for="password" style="display:flex;justify-content:space-between">Password <a href="/forgot" style="color:var(--gold-300)">Forgot password?</a></label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <span class="field__error" data-error="password"></span>
        </div>
        <button class="btn btn--gold btn--lg btn--block" style="margin-top:22px" type="submit">Sign in</button>
      </form>
      <p class="auth__switch">New to Sentinel? <a href="/signup" data-keep-query>Create an account</a></p>
      <p class="auth__switch" style="margin-top:6px"><a href="/guest">Continue as a guest</a> <span class="muted">(ten link scans a day, nothing saved)</span></p>
    </div>

    <div class="auth__inner" data-step="code" hidden>
      <h1>Two-factor <span class="serif italic">check</span></h1>
      <p>Enter the 6-digit code from your authenticator app.</p>
      <div data-note-code></div>
      <form data-code-form novalidate style="margin-top:28px">
        <div class="field">
          <label for="code">Authentication code</label>
          <input class="input code-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
        </div>
        <button class="btn btn--gold btn--lg btn--block" style="margin-top:22px" type="submit">Verify</button>
      </form>
      <p class="auth__switch"><a href="/login">Use a different account</a></p>
    </div>
  </section>
  <!-- @include auth-art -->
</div>
<script src="/assets/js/masks.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
