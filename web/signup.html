<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<link rel="stylesheet" href="/assets/css/app.css">
<title>Create your account · Sentinel</title>
<meta name="description" content="Create a free Sentinel account.">
</head>
<body>
<div class="auth">
  <section class="auth__form">
    <a class="logo" href="/"><span class="logo__mark" data-glyph="scam"></span>Sentinel</a>

    <div class="auth__inner">
      <h1>Start seeing <span class="serif italic">through the masks</span></h1>
      <p>Free forever for manual scans. No card needed.</p>

      <div data-note></div>
      <!-- @include google-button -->
      <div class="divider">or</div>

      <form data-form novalidate>
        <div class="row2">
          <div class="field">
            <label for="firstName">First name</label>
            <input class="input" id="firstName" name="firstName" autocomplete="given-name" required maxlength="60">
            <span class="field__error" data-error="firstName"></span>
          </div>
          <div class="field">
            <label for="lastName">Last name <span class="opt">(optional)</span></label>
            <input class="input" id="lastName" name="lastName" autocomplete="family-name" maxlength="60">
            <span class="field__error" data-error="lastName"></span>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <span class="field__error" data-error="email"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
          <div class="strength" data-strength data-score="0"><i></i><i></i><i></i><i></i></div>
          <span class="field__error" data-error="password"></span>
          <span class="field__hint" data-hint>At least 10 characters, with a letter and a number.</span>
        </div>
        <div class="consent">
          <label class="consent__row">
            <input type="checkbox" name="ageConfirmed" value="yes">
            <span>I confirm that I am at least 18 years old.</span>
          </label>
          <span class="field__error" data-error="ageConfirmed"></span>
          <label class="consent__row">
            <input type="checkbox" name="termsAccepted" value="yes">
            <span>I have read and accept the <a href="/terms" target="_blank" rel="noopener">Terms and Conditions</a> and the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
          </label>
          <span class="field__error" data-error="termsAccepted"></span>
        </div>
        <button class="btn btn--gold btn--lg btn--block" style="margin-top:18px" type="submit">Create account</button>
      </form>
      <p class="auth__switch">Already have an account? <a href="/login" data-keep-query>Sign in</a></p>
      <p class="auth__legal">Sentinel is for adults. Accounts need a confirmed email address to keep.</p>
    </div>
  </section>
  <!-- @include auth-art -->
</div>
<script src="/assets/js/masks.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
