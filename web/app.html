<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<link rel="stylesheet" href="/assets/css/app.css">
<title>Sentinel</title>
<meta name="robots" content="noindex">
</head>
<body class="app">

<div class="shell">
  <aside class="side" aria-label="Sentinel">
    <a class="logo" href="/">
      <span class="logo__mark" data-glyph="logo"></span>
      Sentinel
    </a>

    <button class="side__search" type="button" data-palette aria-label="Search or scan (Ctrl K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search or scan</span><kbd>Ctrl K</kbd>
    </button>

    <nav class="side__nav" aria-label="App">
      <a class="side__link" href="/app" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"/></svg>
        Overview
      </a>
      <a class="side__link" href="/app/scan" data-route="scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
        Link scan
      </a>
      <a class="side__link" href="/app/threats" data-route="threats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.5 3 8.2 7 9 4-.8 7-4.5 7-9V6l-7-3Z"/><path d="M12 9v4M12 16h.01"/></svg>
        Virus &amp; malware
      </a>
      <a class="side__link" href="/app/email" data-route="email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Email scan
        <span class="pill" data-max-pill>MAX</span>
      </a>
      <a class="side__link" href="/app/history" data-route="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7"/><path d="M4 4v4.7h4.7M12 8v4l3 2"/></svg>
        History
      </a>
      <a class="side__link" href="/app/sites" data-route="sites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m15 16 2 2 4-4"/></svg>
        Site rules
      </a>

      <div class="side__label">Account</div>
      <a class="side__link is-secondary" href="/app/protection" data-route="protection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        Live protection
      </a>
      <a class="side__link is-secondary" href="/app/plan" data-route="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.4 6.7 19.1l1-5.8L3.5 9.2l5.9-.9Z"/></svg>
        Plan &amp; usage
      </a>
      <a class="side__link is-secondary" href="/app/security" data-route="security">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Security
      </a>
      <a class="side__link is-secondary" href="/app/assistants" data-route="assistants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/></svg>
        AI assistants
      </a>
    </nav>

    <div class="side__foot">
      <div class="usage-mini" data-usage-mini>
        <div class="skeleton" style="height:64px"></div>
      </div>
      <button class="me" type="button" data-signout title="Sign out">
        <span class="avatar" data-avatar></span>
        <span class="me__text"><span class="me__name" data-name>&nbsp;</span><span class="me__plan" data-plan>&nbsp;</span></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="color:var(--faint)"><path d="M15 12H4m0 0 4-4m-4 4 4 4M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg>
      </button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar-mobile">
      <a class="logo" href="/"><span class="logo__mark" data-glyph="logo"></span>Sentinel</a>
      <span style="display:flex;gap:8px"><button class="btn btn--sm" type="button" data-palette aria-label="Search or scan"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><a class="btn btn--sm" href="/app/security" aria-label="Account"><span class="avatar" data-avatar style="width:24px;height:24px;font-size:10px"></span></a></span>
    </div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<script src="/assets/js/masks.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
