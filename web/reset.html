<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<link rel="stylesheet" href="/assets/css/app.css">
<title>Choose a new password · Sentinel</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
</head>
<body data-page="reset">
<div class="auth">
  <section class="auth__form">
    <a class="logo" href="/"><span class="logo__mark" data-glyph="scam"></span>Sentinel</a>
    <div class="auth__inner">
      <h1>Choose a new <span class="serif italic">password</span></h1>
      <p>You’ll be signed out everywhere, then you can sign in with the new password.</p>
      <div data-note></div>
      <form data-form novalidate style="margin-top:28px">
        <div class="field">
          <label for="password">New password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
          <div class="strength" data-strength data-score="0"><i></i><i></i><i></i><i></i></div>
          <span class="field__hint">At least 10 characters, with a letter and a number.</span>
        </div>
        <button class="btn btn--gold btn--lg btn--block" style="margin-top:22px" type="submit">Save new password</button>
      </form>
      <p class="auth__switch"><a href="/login">Back to sign in</a></p>
    </div>
  </section>
  <!-- @include auth-art -->
</div>
<script src="/assets/js/masks.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/reset.js"></script>
</body>
</html>
