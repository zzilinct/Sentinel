# Runs the test suite on every push and pull request to main, and on work/* branches (so changes are tested on
# GitHub's machines, never on a developer's own computer, before they reach main). The desktop
# installer is not built here; release.yml does that for tagged versions.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
