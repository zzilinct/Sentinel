# Runs the test suite on every push and pull request to main, and on work/* branches (so changes are tested on
# GitHub's machines, never on a developer's own computer, before they reach main). The desktop
# installer is not built here; release.yml does that for tagged versions.
name: Test

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  # web/assets/js/mask3d.js is built from scripts/mask3d/mask3d.src.js (three.js and esbuild are fetched at pinned
  # versions, here and never on a developer's computer). The build is kept as an artifact, and the job fails while the
  # committed file is out of step with its source.
  mask3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mask3d/build.js
      - uses: actions/upload-artifact@v4
        with:
          name: mask3d
          path: web/assets/js/mask3d.js
          retention-days: 7
      - name: The committed mask3d.js matches its source
        run: git diff --stat --exit-code web/assets/js/mask3d.js

  # The quality gate for the 3D masks (web/assets/models/*.glb): Blender, with no window, imports each model as the
  # site downloads it, checks it with numbers (closed, outward-facing, UVs, normal and occlusion maps, triangle budget;
  # scripts/blender/mask_qa.py) and photographs it close up. The pictures are kept as the "masks-qa" artifact.
  masks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5.0.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          curl -sSfL https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Check and photograph the masks
        run: |
          "$BLENDER" --background --factory-startup --python scripts/blender/mask_qa.py -- masks-qa \
            web/assets/models/scam.glb web/assets/models/virus.glb web/assets/models/malware.glb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masks-qa
          path: masks-qa/
          retention-days: 14
