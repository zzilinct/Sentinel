# Runs the test suite on every push and pull request to main, and on work/* branches (so changes are tested on
# GitHub's machines, never on a developer's own computer, before they reach main). The desktop
# installer is not built here; release.yml does that for tagged versions.
name: Test

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test

  # The false-alarm gate (scripts/fpgate/gate.js): the address rules judged on a frozen sample of real, honest
  # domains, once with main's rules and once with these. A domain these rules flag that main's did not (or flag
  # higher), and that is not in the known baseline, fails the run, printed with the rule that fired. So does a
  # baseline entry these rules no longer flag (--ratchet): the baseline only shrinks, in the change that fixed it.
  # The remainder is printed counted by rule. Names only: no site is opened or looked up.
  false-alarms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Main's rules on the same domains
        if: github.ref_name != 'main'
        run: |
          git fetch --depth 1 origin main
          git worktree add ../main FETCH_HEAD
          node scripts/fpgate/gate.js --root ../main --save main-flags.json --save-only
      - name: These rules, against main's and the baseline
        run: |
          if [ -f main-flags.json ]; then node scripts/fpgate/gate.js --ratchet --against main-flags.json --save flags.json; else node scripts/fpgate/gate.js --ratchet --save flags.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: false-alarms
          path: '*flags.json'
          retention-days: 7

  # web/assets/js/mask3d.js is built from scripts/mask3d/mask3d.src.js (three.js and esbuild are fetched at pinned
  # versions, here and never on a developer's computer). The build is kept as an artifact, and the job fails while the
  # committed file is out of step with its source.
  mask3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/mask3d/build.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mask3d
          path: web/assets/js/mask3d.js
          retention-days: 7
      - name: The committed mask3d.js matches its source
        run: git diff --stat --exit-code web/assets/js/mask3d.js

  # The quality gate for the 3D masks (web/assets/models/*.glb): Blender, with no window, imports each model as the
  # site downloads it, checks it with numbers (closed, outward-facing, UVs, normal and occlusion maps, triangle budget;
  # scripts/blender/mask_qa.py) and photographs it close up. The pictures are kept as the "masks-qa" artifact.
  masks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # download.blender.org answers runners with 403 now and then, so the archive is kept in the Actions cache and,
      # when the cache is cold, fetched from Blender's own mirrors in turn, then held to its published SHA-256.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/blender-cache
          key: blender-5.0.1-linux-x64
      - name: Blender 5.0.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          f=~/blender-cache/blender-5.0.1-linux-x64.tar.xz
          mkdir -p ~/blender-cache
          for m in https://mirror.clarkson.edu/blender https://ftp.nluug.nl/pub/graphics/blender https://download.blender.org; do
            [ -s "$f" ] && break
            curl -sSfL --retry 3 -o "$f" "$m/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz" || rm -f "$f"
          done
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  $f" | sha256sum -c -
          tar -xJf "$f" -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-5.0.1-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Check and photograph the masks
        run: |
          "$BLENDER" --background --factory-startup --python scripts/blender/mask_qa.py -- masks-qa \
            web/assets/models/scam.glb web/assets/models/virus.glb web/assets/models/malware.glb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: masks-qa
          path: masks-qa/
          retention-days: 14
