# Screenshots of every page of the site and the web app, at a desktop and a phone size, for a human-eye review.
# Runs on work/* branches and on demand, on GitHub's machines.
name: Review screenshots

on:
  workflow_dispatch:
  push:
    branches: ['work/**']

permissions:
  contents: read

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-shots.js --out shots
      - uses: actions/upload-artifact@v4
        with:
          name: review-shots
          path: shots/
          retention-days: 7
      # How smoothly the home page runs as a phone and as a computer (frames, freezes, 3D contexts), with frames to look at.
      # The released site is measured on the same machine first: runners differ from run to run, a comparison on one
      # machine does not.
      - name: The released site, to compare against
        run: |
          git fetch --depth 1 origin main
          git worktree add "${{ github.workspace }}/../released" FETCH_HEAD
        continue-on-error: true
      - run: node scripts/perf-probe.js --out perf --label released
        env:
          SENTINEL_ROOT: ${{ github.workspace }}/../released
        continue-on-error: true
      - run: node scripts/perf-probe.js --out perf --label probe
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: perf-probe
          path: perf/
          retention-days: 7
