# The website's Try a link, the QR reader on real QR pictures, and the companion's password alarm and pasted-command
# guard, each in a real headless Chrome (scripts/verify-web.js). Never runs on a person's computer.
name: Website, QR and companion in a real browser

on:
  workflow_dispatch:
    inputs:
      checks:
        description: 'Run only these checks (comma separated) in the features job, and no other job; empty runs everything'
        required: false
        default: ''
      perf_pages:
        description: 'Run only the perf-a11y job, on these pages (comma separated, as "mobile /app"), and no other job'
        required: false
        default: ''
      perf_rounds:
        description: 'With perf_pages: how many times each page is measured'
        required: false
        default: '1'
      perf_base:
        description: 'With perf_pages: also measure this ref (main) on the same runner, back to back with the branch, and report medians'
        required: false
        default: ''
      repeat:
        description: 'With checks: run them this many times in a row, to show a check holds'
        required: false
        default: '1'
      chrome_version:
        description: 'With checks: run them on this Chrome (a Chrome for Testing version, as "157.0.8103.78") instead of the runner image''s own'
        required: false
        default: ''
  push:
    branches: ['work/e2e**']

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !inputs.checks && !inputs.perf_pages }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run build:static
      - name: Real QR pictures, from another encoder
        run: |
          python -m pip install --quiet qrcode pillow
          python scripts/verify-web-qr.py qr-samples
      - run: node scripts/verify-web.js --skip share,webchats,share-odd,webchats-odd,companion-a11y,companion-door,mask-rest,serp-engines,honest-result,calm-dig,downloads,pricing,download-page,hero-phone,auth-shell,settings,simple,states,first-choices,motion-level,app-checklist,visual-list --out verify-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-web
          path: |
            verify-web/
            qr-samples/
          retention-days: 7

  # The checks for 1.18's features (sharing from a phone, web chats, the companion's own pages, the resting masks, the
  # search engines besides Bing), in a job of their own: behind everything above they never got their turn in 90 minutes.
  features:
    if: ${{ !inputs.perf_pages }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run build:static
      - name: Real QR pictures, from another encoder
        run: |
          python -m pip install --quiet qrcode pillow
          python scripts/verify-web-qr.py qr-samples
      # A chosen Chrome, for a check that broke on a newer image's Chrome: the runners move to a new image over days, so
      # a version is tried on purpose instead of waiting to land on it. Unset, the image's own Chrome, as always.
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        if: ${{ inputs.chrome_version }}
        id: chrome
        with:
          chrome-version: ${{ inputs.chrome_version }}
      - run: node scripts/verify-web.js --only $env:CHECKS --out verify-web-features
        env:
          SENTINEL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CHECKS: ${{ inputs.checks || 'share,webchats,share-odd,webchats-odd,companion-a11y,companion-door,mask-rest,serp-engines,honest-result,calm-dig,downloads,pricing,download-page,hero-phone,auth-shell,settings,simple,states,first-choices,motion-level,app-checklist,visual-list' }}
          CHECK_MINUTES: '25'
          REPEAT: ${{ inputs.repeat || '1' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-web-features
          path: verify-web-features/
          retention-days: 7

  # The companion's memory after an hour of browsing (scripts/verify-web/26-companion-soak.js), beside the checks above.
  companion-soak:
    if: ${{ !inputs.checks && !inputs.perf_pages }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/verify-web.js --only companion-soak --out verify-web-soak
        env:
          SOAK_MINUTES: '60'
          CHECK_MINUTES: '80'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-web-soak
          path: verify-web-soak/
          retention-days: 7

  # Speed and accessibility of every public and app page (scripts/verify-web/30-perf-a11y.js): Lighthouse at phone and
  # desktop size and an axe-core audit in dark and light. Both are installed for this job only, never into the project.
  perf-a11y:
    if: ${{ !inputs.checks }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lighthouse and axe-core, for this job only
        shell: bash
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ci-tools" lighthouse@13.5.0 axe-core@4.10.3
      - name: The ref to compare with, beside this checkout
        if: ${{ inputs.perf_base }}
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$PERF_BASE" && git worktree add --detach "$RUNNER_TEMP/perf-base" FETCH_HEAD
        env:
          PERF_BASE: ${{ inputs.perf_base }}
      - name: Speed and accessibility of every page
        shell: bash
        run: CI_TOOLS="$RUNNER_TEMP/ci-tools" PERF_BASE_ROOT="${PERF_BASE:+$RUNNER_TEMP/perf-base}" node scripts/verify-web.js --only perf-a11y --out perf-a11y
        env:
          PERF_PAGES: ${{ inputs.perf_pages }}
          PERF_ROUNDS: ${{ inputs.perf_rounds }}
          PERF_BASE: ${{ inputs.perf_base }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-a11y
          path: perf-a11y/
          retention-days: 7
