# The website's Try a link, the QR reader on real QR pictures, and the companion's password alarm and pasted-command
# guard, each in a real headless Chrome (scripts/verify-web.js). Never runs on a person's computer.
name: Website, QR and companion in a real browser

on:
  workflow_dispatch:
  push:
    branches: ['work/e2e**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:static
      - name: Real QR pictures, from another encoder
        run: |
          python -m pip install --quiet qrcode pillow
          python scripts/verify-web-qr.py qr-samples
      - run: node scripts/verify-web.js --out verify-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-web
          path: |
            verify-web/
            qr-samples/
          retention-days: 7

  # The companion's memory after an hour of browsing (scripts/verify-web/26-companion-soak.js), beside the checks above.
  companion-soak:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-web.js --only companion-soak --out verify-web-soak
        env:
          SOAK_MINUTES: '60'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-web-soak
          path: verify-web-soak/
          retention-days: 7

  # TEMPORARY while iterating: the companion-core check alone, for a fast answer.
  companion-core-only:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-web.js --only companion-core --out verify-web-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-web-core
          path: verify-web-core/
          retention-days: 7
