# The website's Try a link, the QR reader on real QR pictures, and the companion's password alarm and pasted-command
# guard, each in a real headless Chrome (scripts/verify-web.js). Never runs on a person's computer.
name: Website, QR and companion in a real browser

on:
  workflow_dispatch:
    inputs:
      checks:
        description: 'Run only these checks (comma separated) in the features job, and no other job; empty runs everything'
        required: false
        default: ''
  push:
    branches: ['work/e2e**']

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !inputs.checks }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:static
      - name: Real QR pictures, from another encoder
        run: |
          python -m pip install --quiet qrcode pillow
          python scripts/verify-web-qr.py qr-samples
      - run: node scripts/verify-web.js --skip share,webchats,share-odd,webchats-odd,companion-a11y,mask-rest,serp-engines,calm-dig --out verify-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-web
          path: |
            verify-web/
            qr-samples/
          retention-days: 7

  # The checks for 1.18's features (sharing from a phone, web chats, the companion's own pages, the resting masks, the
  # search engines besides Bing), in a job of their own: behind everything above they never got their turn in 90 minutes.
  features:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:static
      - name: Real QR pictures, from another encoder
        run: |
          python -m pip install --quiet qrcode pillow
          python scripts/verify-web-qr.py qr-samples
      - run: node scripts/verify-web.js --only $env:CHECKS --out verify-web-features
        env:
          CHECKS: ${{ inputs.checks || 'share,webchats,share-odd,webchats-odd,companion-a11y,mask-rest,serp-engines,calm-dig' }}
          CHECK_MINUTES: '25'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-web-features
          path: verify-web-features/
          retention-days: 7

  # The companion's memory after an hour of browsing (scripts/verify-web/26-companion-soak.js), beside the checks above.
  companion-soak:
    if: ${{ !inputs.checks }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-web.js --only companion-soak --out verify-web-soak
        env:
          SOAK_MINUTES: '60'
          CHECK_MINUTES: '80'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-web-soak
          path: verify-web-soak/
          retention-days: 7

  # Speed and accessibility of every public and app page (scripts/verify-web/30-perf-a11y.js): Lighthouse at phone and
  # desktop size and an axe-core audit in dark and light. Both are installed for this job only, never into the project.
  perf-a11y:
    if: ${{ !inputs.checks }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lighthouse and axe-core, for this job only
        shell: bash
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ci-tools" lighthouse@13.5.0 axe-core@4.10.3
      - name: Speed and accessibility of every page
        shell: bash
        run: CI_TOOLS="$RUNNER_TEMP/ci-tools" node scripts/verify-web.js --only perf-a11y --out perf-a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-a11y
          path: perf-a11y/
          retention-days: 7
