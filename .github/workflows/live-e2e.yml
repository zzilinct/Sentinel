# Live scanning end to end on a GitHub-hosted Windows desktop: the app built from this commit (or a released version),
# a real browser, real scrolling, screenshots along the way (scripts/live-e2e.ps1). Never runs on a person's computer.
name: Live scanning end to end

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to test instead of building this commit (empty: build this commit)'
        required: false
  push:
    branches: ['work/e2e**']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the Windows installer from this commit
        if: ${{ !github.event.inputs.version }}
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win
      - shell: powershell
        run: |
          $installer = if ("${{ github.event.inputs.version }}") { '' } else { (Get-ChildItem desktop/dist/Sentinel-Setup-*.exe | Select-Object -First 1).FullName }
          ./scripts/live-e2e.ps1 -Version "${{ github.event.inputs.version }}" -Installer $installer -Out e2e
      # Sentinel's own logs, whatever happened: a start that failed still leaves app.log.
      - name: Sentinel's logs
        if: always()
        shell: powershell
        run: New-Item -ItemType Directory -Force e2e/logs | Out-Null; Copy-Item "$env:APPDATA\Sentinel\logs\*" e2e/logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e
          path: e2e/
          retention-days: 7
