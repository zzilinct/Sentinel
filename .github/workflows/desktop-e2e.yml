# The desktop protections end to end on a GitHub-hosted Windows desktop: chat safety (Discord, Roblox), "Stop pasted
# commands", the tech-support scam shield and the parent lock, in the app built from this commit and installed
# (scripts/desktop-e2e.ps1). Never runs on a person's computer.
name: Desktop protections end to end

on:
  workflow_dispatch:
  push:
    branches: ['work/e2e**']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the Windows installer from this commit
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win
      - shell: powershell
        run: ./scripts/desktop-e2e.ps1 -Installer (Get-ChildItem desktop/dist/Sentinel-Setup-*.exe | Select-Object -First 1).FullName -Out e2e-desktop
      # Sentinel's own logs, whatever happened: a start that failed still leaves app.log (and the screenshot above).
      - name: Sentinel's logs
        if: always()
        shell: powershell
        run: New-Item -ItemType Directory -Force e2e-desktop/logs | Out-Null; Copy-Item "$env:APPDATA\Sentinel\logs\*" e2e-desktop/logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e
          path: e2e-desktop/
          retention-days: 7
