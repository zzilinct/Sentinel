# Publishes the marketing site to GitHub Pages from this repository, so the
# static copy is always built from the same web/ the server renders.
#
# Enable once under Settings -> Pages -> Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'brand.json'
      - 'scripts/build-static.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits: this workflow can publish the site.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # Nothing is published unless the suite passes (the demo verdicts come from server/).
      - run: npm test
      # Resolved first so the build can use the real published URL.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      # Seeds the local threat data so the baked demo verdicts are real.
      - run: node scripts/admin.js refresh-feeds || echo "feeds unavailable; using bundled intelligence"
      # --origin makes social previews and any live links point at where this
      # actually lands, which is the Pages URL until the domain is pointed.
      - run: node scripts/build-static.js --out dist-static --origin "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
