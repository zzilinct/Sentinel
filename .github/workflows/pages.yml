# Publishes the marketing site to GitHub Pages from this repository, so the
# static copy is always built from the same web/ the server renders.
#
# Enable once under Settings -> Pages -> Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'brand.json'
      - 'scripts/build-static.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Resolved first so the build can use the real published URL.
      - uses: actions/configure-pages@v5
        id: pages
      # Seeds the local threat data so the baked demo verdicts are real.
      - run: node scripts/admin.js refresh-feeds || echo "feeds unavailable; using bundled intelligence"
      # --origin makes social previews and any live links point at where this
      # actually lands, which is the Pages URL until the domain is pointed.
      - run: node scripts/build-static.js --out dist-static --origin "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
