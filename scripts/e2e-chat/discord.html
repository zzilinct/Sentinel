<!doctype html>
<!-- A stand-in for the Discord app's message list (scripts/desktop-e2e.ps1): the same accessible structure Discord
     gives screen readers, an ordered list named "Messages in ..." with a heading for each author. -->
<html lang="en"><head><meta charset="utf-8"><title>#general | Test Server - Discord</title>
<style>body{margin:0;font:18px Segoe UI,sans-serif;background:#313338;color:#dbdee1}ol{list-style:none;margin:0;padding:24px}li{padding:10px 0}h3{margin:0 0 4px;font-size:17px;color:#f2f3f5}</style></head>
<body><main>
<ol role="list" aria-label="Messages in general">
  <li id="chat-messages-1"><h3>Alex</h3><div>hi everyone, who is up for a game later?</div></li>
  <li id="chat-messages-2"><h3>Stranger</h3><div>call me 876-555-0123</div></li>
  <li id="chat-messages-3"><h3>Stranger</h3><div>don't tell your parents, our secret</div></li>
</ol>
</main></body></html>
