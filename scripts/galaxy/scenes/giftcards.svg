<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22394a"/><stop offset="1" stop-color="#0f1a24"/></linearGradient></defs><rect x="0" y="0" width="480" height="270" fill="url(#bg)"/><rect x="26" y="20" width="428" height="230" rx="10" fill="#24232f"/><rect x="26" y="20" width="428" height="30" rx="10" fill="#2e2c3c"/><rect x="26" y="40" width="428" height="10" fill="#2e2c3c"/><text x="46" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#cfd0e0">Direct message</text><circle cx="58" cy="70" r="11" fill="#7fb6ff"/><text x="78" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#7fb6ff">Alex (Manager)</text><text x="78" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7e8f0">Are you free? I need a quick favour.</text><circle cx="58" cy="115" r="11" fill="#7fb6ff"/><text x="78" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#7fb6ff">Alex (Manager)</text><text x="78" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7e8f0">Buy 4 gift cards of $100 each and</text><text x="78" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7e8f0">send me photos of the codes.</text><circle cx="58" cy="175" r="11" fill="#7fb6ff"/><text x="78" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#7fb6ff">Alex (Manager)</text><text x="78" y="187" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e7e8f0">Keep it between us for now.</text><rect x="46" y="218" width="388" height="20" rx="10" fill="#34323f"/><text x="58" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7d7c90">Message</text></svg>
